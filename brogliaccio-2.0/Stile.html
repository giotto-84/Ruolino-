<style>
:root {
  --bg: #f3f4f1; --carta: #ffffff; --testo: #1d2320; --tenue: #66706a; --bordo: #d5d9d3;
  --primario: #3f5f3a; --primario-chiaro: #e3ebe0; --rosso: #b3261e; --giallo: #c79100; --blu: #2f5d8a; --verde: #2e7d32;

}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--testo); }
main { max-width: 1250px; margin: 0 auto; padding: 16px; }

h1 { font-size: 22px; margin: 4px 0 12px; }
h2 { font-size: 17px; margin: 0 0 10px; }

.barra { display: flex; align-items: center; gap: 18px; background: var(--primario); color: #fff; padding: 0 16px; flex-wrap: wrap; }

.barra .utente { display: flex; gap: 10px; align-items: center; }
.barra .utente form { margin: 0; }
.barra button.link { color: #fff; }

button, .bottone { font: inherit; padding: 6px 12px; border: 1px solid var(--bordo); background: var(--carta); border-radius: 6px; cursor: pointer; color: var(--testo); text-decoration: none; display: inline-block; }
button:hover, .bottone:hover { border-color: var(--primario); }
.primario { background: var(--primario); color: #fff !important; border-color: var(--primario); }
.pericolo { color: var(--rosso) !important; }
button.pericolo { border-color: var(--rosso); }
button.link { background: none; border: none; padding: 0; text-decoration: underline; color: var(--primario); }
input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--bordo); border-radius: 6px; background: #fff; max-width: 100%; }

.intestazione { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.naviga { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inline { display: inline; margin: 0; }
.riquadro { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.colonne { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.colonne .riquadro { margin-bottom: 0; }
.colonne + * { margin-top: 14px; }
.riquadro ul { margin: 0; padding-left: 18px; }
.vuoto { color: var(--tenue); font-style: italic; }
.aiuto { color: var(--tenue); font-size: 13px; }
.avviso { background: #fff4d6; border-left: 4px solid var(--giallo); padding: 6px 10px; }
.piccolo { font-size: 12px; font-weight: normal; margin-left: 8px; }
.msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; background: var(--primario-chiaro); }
.msg.error { background: #fde4e1; color: var(--rosso); }
.errore, .errorlist { color: var(--rosso); }

.riepilogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.numero { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; padding: 10px 14px; color: var(--tenue); border-top: 4px solid var(--tenue); }
.numero span { display: block; font-size: 30px; font-weight: 700; color: var(--testo); }
.numero.verde { border-top-color: var(--verde); } .numero.giallo { border-top-color: var(--giallo); }
.numero.blu { border-top-color: var(--blu); } .numero.rosso { border-top-color: var(--rosso); }

.tabella { width: 100%; border-collapse: collapse; background: var(--carta); }
.tabella th, .tabella td { border-bottom: 1px solid var(--bordo); padding: 5px 8px; text-align: left; vertical-align: top; }
.tabella th { background: #eef0ec; font-weight: 600; }
.tabella.licenze td, .tabella.licenze th { text-align: center; border: 1px solid var(--bordo); }

.negativo { color: var(--rosso); }
.spento { opacity: .5; }
.etichetta { display: inline-block; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); font-size: 12px; font-weight: 600; }

/* Ruolino */
.pennello { background: var(--carta); border: 1px solid var(--bordo); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; left: 0; }
.contenitore-griglia { overflow: auto; max-height: calc(100vh - 220px); border: 1px solid var(--bordo); background: var(--carta); }
.griglia { border-collapse: separate; border-spacing: 0; font-size: 11px; }
.griglia th, .griglia td { border-right: 1px solid var(--bordo); border-bottom: 1px solid var(--bordo); padding: 2px 3px; }
.griglia thead th { position: sticky; top: 0; background: #eef0ec; z-index: 2; text-align: center; min-width: 54px; }
.griglia thead th.festivo { background: #cfd4cb; }
.griglia thead th.oggi { background: var(--primario); color: #fff; }
.griglia .fisso { position: sticky; background: var(--carta); z-index: 1; white-space: nowrap; }
.griglia thead .fisso { z-index: 3; background: #eef0ec; }
.griglia .c1 { left: 0; width: 42px; min-width: 42px; text-align: center; }
.griglia .c2 { left: 42px; width: 90px; min-width: 90px; }

.griglia td.cella { min-width: 54px; max-width: 70px; height: 30px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; position: relative; }

.griglia.pennello-attivo td.cella { cursor: crosshair; }
.griglia .nota { position: absolute; top: 0; right: 1px; font-size: 8px; color: #c00; }

.legenda { line-height: 2; }

/* Scadenze */
.st-scaduta, .tabella td.st-scaduta { background: #f8d4d0; }
.st-in_scadenza, .tabella td.st-in_scadenza { background: #ffefc2; }

.legenda-stati span { padding: 2px 8px; border-radius: 4px; border: 1px solid var(--bordo); margin-right: 4px; }
.matrice td, .matrice th { text-align: center; border: 1px solid var(--bordo); white-space: nowrap; }

/* Moduli */
.modulo { max-width: 720px; margin: 0 auto; }
.campo { margin-bottom: 12px; display: flex; flex-direction: column; gap: 3px; }
.campo label { font-weight: 600; }
.campo small { color: var(--tenue); }
.campo.con-errore input, .campo.con-errore select { border-color: var(--rosso); }
label.check { display: inline-flex; gap: 6px; align-items: center; font-weight: normal; }
.azioni { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
.login { max-width: 360px; margin: 80px auto; }
.login form { display: grid; gap: 12px; }
.login label { display: grid; gap: 4px; font-weight: 600; }
.schede { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
.schede a { padding: 6px 12px; border-radius: 6px; background: var(--carta); border: 1px solid var(--bordo); text-decoration: none; }
.schede a.attiva { background: var(--primario); color: #fff; border-color: var(--primario); }
dl.dati { display: grid; grid-template-columns: 140px 1fr; gap: 4px 10px; margin: 0; }

dl.dati dd { margin: 0; }

@media print {
