{% extends "personale/base.html" %}
{% block titolo %}Accesso{% endblock %}
{% block contenuto %}
<div class="riquadro login">
  <h1>Ruolino del personale</h1>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<p class="errore">Nome utente o password errati.</p>{% endif %}
    <label>Nome utente<input name="username" autofocus required></label>
    <label>Password<input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primario">Accedi</button>
  </form>
</div>
{% endblock %}
