<script>
/* Ruolino - interfaccia web (Google Apps Script) */
var CFG = null, UTENTE = null, LIVELLO = 0;
var LIVELLI = { Consultazione: 1, Operatore: 2, Amministratore: 3 };
var CATEGORIE = { SER: 'Servizio in sede', ATT: "Attivita' / visite in sede", FUO: 'Fuori sede', ASS: 'Assenza', ALT: 'Altro / note' };
var STATI_MIL = { EFF: 'Effettivo', EXT: 'Extra / aggregato', PER: 'Perso dalla forza' };
var MESI = ['', 'Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
var SETT = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];

// ---------------------------------------------------------------- utilita'
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function oggi() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function it(s) { if (!s) return ''; var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; }
function piuGiorni(s, n) { var p = s.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
function giornoSett(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); }
function num(v) { if (v === '' || v === null || v === undefined) return ''; var n = Number(v); return isNaN(n) ? v : String(Math.round(n * 100) / 100).replace('.', ','); }
function si(v) { return /^(si|sì|true|1|x)$/i.test(String(v || '').trim()); }
function puo(ruolo) { return LIVELLO >= LIVELLI[ruolo]; }
function codice(c) { return CFG.codiciMap[c] || { codice: c, colore_sfondo: '#FFFFFF', colore_testo: '#000000', descrizione: '' }; }
function etichetta(c, loc) { var k = codice(c); return '<span class="etichetta" style="background:' + esc(k.colore_sfondo) + ';color:' + esc(k.colore_testo) + '" title="' + esc(k.descrizione) + '">' + esc(c + (loc ? ' ' + loc : '')) + '</span>'; }
function opzioni(lista, sel) {
  return lista.map(function (o) {
    var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
    var s = Array.isArray(sel) ? sel.indexOf(String(v)) >= 0 : String(v) === String(sel);
    return '<option value="' + esc(v) + '"' + (s ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
}
/** argomento sicuro per onclick="..." */
function J(v) { return esc(JSON.stringify(v === undefined ? null : v)); }
/** selezione multipla: casella per riga, casella "tutti" in intestazione, pulsante elimina */
function sel(gruppo, valore) { return '<input type="checkbox" class="sel" data-g="' + gruppo + '" value="' + esc(valore) + '" onchange="contaSel(\'' + gruppo + '\')">'; }
function selTutti(gruppo) { return '<input type="checkbox" title="seleziona tutti" onchange="selezionaTutti(\'' + gruppo + '\', this.checked)">'; }
function selezionaTutti(gruppo, v) { document.querySelectorAll('input.sel[data-g="' + gruppo + '"]').forEach(function (c) { c.checked = v; }); contaSel(gruppo); }
function selezionati(gruppo) { return Array.prototype.map.call(document.querySelectorAll('input.sel[data-g="' + gruppo + '"]:checked'), function (c) { return c.value; }); }
function contaSel(gruppo) {
  var n = selezionati(gruppo).length, b = document.getElementById('elimina-' + gruppo);
  if (b) { b.hidden = !n; b.textContent = b.dataset.testo + ' (' + n + ')'; }
}
function bottoneSel(gruppo, testo, funzione) {
  return '<button type="button" class="bottone pericolo" hidden id="elimina-' + gruppo + '" data-testo="' + esc(testo) + '" onclick="' + funzione + '(selezionati(\'' + gruppo + '\'))">' + esc(testo) + '</button>';
}
function nomeMil(m) { return (m.grado + ' ' + m.cognome + ' ' + m.nome).trim(); }

function api(azione, dati, silenzioso) {
  if (!silenzioso) document.getElementById('attesa').hidden = false;
  return new Promise(function (ok, ko) {
    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById('attesa').hidden = true;
        if (r && r.errore) { avviso(r.errore, true); ko(new Error(r.errore)); } else ok(r ? r.ok : null);
      })
      .withFailureHandler(function (e) {
        document.getElementById('attesa').hidden = true;
        avviso('Errore: ' + (e && e.message ? e.message : e), true); ko(e);
      })
      .api(azione, dati || {});
  });
}

function avviso(testo, errore) {
  var d = document.createElement('div');
  d.className = 'msg' + (errore ? ' error' : '');
  d.textContent = testo;
  document.getElementById('avvisi').appendChild(d);
  setTimeout(function () { d.remove(); }, errore ? 8000 : 3500);
}

function leggiFile(input) {
  var f = input && input.files && input.files[0];
  if (!f) return Promise.resolve(null);
  if (f.size > 20 * 1024 * 1024) { avviso('File troppo grande (massimo 20 MB)', true); return Promise.reject(new Error('file')); }
  return new Promise(function (ok) {
    var r = new FileReader();
    r.onload = function () { ok({ nome: f.name, mime: f.type, base64: String(r.result).split(',')[1] }); };
    r.readAsDataURL(f);
  });
}

// ---------------------------------------------------------------- dialoghi e moduli
function apriDialogo(html) { document.getElementById('dlg-corpo').innerHTML = html; var d = document.getElementById('dlg'); if (!d.open) d.showModal(); }
function chiudiDialogo() { var d = document.getElementById('dlg'); if (d.open) d.close(); }

/** campi: [{n, l, t, v, o (opzioni), aiuto, req}] */
function modulo(titolo, campi, pulsanti) {
  var h = '<h2>' + esc(titolo) + '</h2><form id="modulo" onsubmit="return false">';
  campi.forEach(function (c) {
    var t = c.t || 'text', v = c.v === undefined || c.v === null ? '' : c.v, id = 'f_' + c.n;
    h += '<div class="campo">';
    if (t === 'checkbox') {
      h += '<label class="check"><input type="checkbox" name="' + c.n + '"' + (si(v) || v === true ? ' checked' : '') + '> ' + esc(c.l) + '</label>';
    } else {
      h += '<label for="' + id + '">' + esc(c.l) + (c.req ? ' *' : '') + '</label>';
      if (t === 'select') h += '<select id="' + id + '" name="' + c.n + '">' + opzioni(c.o, v) + '</select>';
      else if (t === 'multi') h += '<select id="' + id + '" name="' + c.n + '" multiple>' + opzioni(c.o, v) + '</select>';
      else if (t === 'textarea') h += '<textarea id="' + id + '" name="' + c.n + '" rows="3">' + esc(v) + '</textarea>';
      else if (t === 'file') h += '<input id="' + id + '" type="file" name="' + c.n + '"' + (c.accept ? ' accept="' + c.accept + '"' : '') + '>';
      else h += '<input id="' + id + '" type="' + t + '" name="' + c.n + '" value="' + esc(v) + '"' + (c.req ? ' required' : '') + (t === 'number' ? ' step="any"' : '') + '>';
    }
    if (c.aiuto) h += '<small>' + esc(c.aiuto) + '</small>';
    h += '</div>';
  });
  h += '<div class="azioni">' + (pulsanti || '<button class="primario" id="salva">Salva</button> <button type="button" onclick="chiudiDialogo()">Annulla</button>') + '</div></form>';
  return h;
}

function datiModulo() {
  var f = document.getElementById('modulo'), out = {};
  Array.prototype.forEach.call(f.elements, function (el) {
    if (!el.name || el.type === 'file') return;
    if (el.type === 'checkbox') out[el.name] = el.checked ? 'SI' : 'NO';
    else if (el.multiple) out[el.name] = Array.prototype.filter.call(el.options, function (o) { return o.selected; }).map(function (o) { return o.value; });
    else out[el.name] = el.value;
  });
  return out;
}

function alSalva(fn) {
  var b = document.getElementById('salva');
  b.onclick = function () {
    var f = document.getElementById('modulo');
    if (!f.reportValidity()) return;
    b.disabled = true;
    Promise.resolve(fn(datiModulo())).then(function () { b.disabled = false; }, function () { b.disabled = false; });
  };
}

// ---------------------------------------------------------------- avvio e navigazione
function avvio() {
  api('avvio').then(function (r) {
    UTENTE = r.utente; LIVELLO = LIVELLI[UTENTE.ruolo] || 0;
    impostaConfig(r.config);
    document.getElementById('utente').innerHTML = '<span title="' + esc(UTENTE.email) + '">' + esc(UTENTE.nome || UTENTE.email) + '</span> <span class="badge">' + esc(UTENTE.ruolo) + '</span>';
    var voci = [['situazione', 'Situazione'], ['ruolino', 'Ruolino'], ['militari', 'Militari'], ['licenze', 'Licenze'], ['scadenze', 'Scadenze']];
    voci.push(['config', 'Configurazione']);
    if (puo('Amministratore')) voci.push(['importa', 'Importa Excel'], ['utenti', 'Utenti']);
    if (puo('Operatore')) voci.push(['registro', 'Registro']);
    document.getElementById('menu').innerHTML = voci.map(function (v) { return '<a href="#' + v[0] + '" data-r="' + v[0] + '">' + v[1] + '</a>'; }).join('')
      + (CFG.cartellaUrl ? '<a href="' + esc(CFG.cartellaUrl) + '" target="_blank" title="Cartella dei file su Google Drive">Drive ↗</a>' : '');
    window.addEventListener('hashchange', instrada);
    instrada();
  });
}

function impostaConfig(c) {
  CFG = c;
  CFG.codiciMap = {};
  c.codici.forEach(function (k) { CFG.codiciMap[k.codice] = k; });
  CFG.codiciAttivi = c.codici.filter(function (k) { return si(k.attivo); });
}

function ricaricaConfig() { return api('avvio', {}, true).then(function (r) { impostaConfig(r.config); }); }

function instrada() {
  var p = (location.hash.replace(/^#/, '') || 'situazione').split('/');
  document.querySelectorAll('#menu a').forEach(function (a) { a.classList.toggle('attivo', a.dataset.r === p[0]); });
  document.body.classList.toggle('largo', ['ruolino', 'scadenze', 'licenze'].indexOf(p[0]) >= 0);
  var viste = { situazione: vistaSituazione, ruolino: vistaRuolino, militari: vistaMilitari, militare: vistaMilitare,
    licenze: vistaLicenze, scadenze: vistaScadenze, config: vistaConfig, importa: vistaImporta, utenti: vistaUtenti, registro: vistaRegistro };
  (viste[p[0]] || vistaSituazione).apply(null, p.slice(1));
}
function ricarica() { instrada(); }
function main(html) { document.getElementById('main').innerHTML = html; }

// ---------------------------------------------------------------- situazione
function vistaSituazione(data) {
  data = data || oggi();
  api('situazione', { data: data, oggi: oggi() }).then(function (r) {
    function elenco(gruppi) {
      var k = Object.keys(gruppi).sort();
      if (!k.length) return '<p class="vuoto">Nessuno.</p>';
      return k.map(function (c) {
        return '<h3>' + etichetta(c) + ' (' + gruppi[c].length + ')</h3><ul>' + gruppi[c].map(function (m) {
          return '<li><a href="#militare/' + esc(m.id) + '">' + esc(m.nome) + '</a>' + (m.localita ? ' - ' + esc(m.localita) : '') + '</li>';
        }).join('') + '</ul>';
      }).join('');
    }
    var nAss = 0, nFuo = 0;
    Object.keys(r.assenti).forEach(function (k) { nAss += r.assenti[k].length; });
    Object.keys(r.fuori).forEach(function (k) { nFuo += r.fuori[k].length; });
    var giorni = ['domenica', "lunedi'", "martedi'", "mercoledi'", "giovedi'", "venerdi'", 'sabato'];
    var h = '<div class="intestazione"><h1>Situazione della forza - ' + giorni[giornoSett(data)] + ' ' + it(data) + '</h1>'
      + '<div class="naviga"><a class="bottone" href="#situazione/' + piuGiorni(data, -1) + '">&larr;</a>'
      + '<input type="date" value="' + data + '" onchange="location.hash=\'situazione/\'+this.value">'
      + '<a class="bottone" href="#situazione/' + piuGiorni(data, 1) + '">&rarr;</a><a class="bottone" href="#situazione/' + oggi() + '">Oggi</a></div></div>'
      + '<div class="riepilogo"><div class="numero"><span>' + r.forza + '</span>Forza</div>'
      + '<div class="numero verde"><span>' + r.presenti.length + '</span>Presenti in sede</div>'
      + '<div class="numero giallo"><span>' + r.servizio.length + '</span>Di servizio</div>'
      + '<div class="numero blu"><span>' + nFuo + '</span>Fuori sede</div>'
      + '<div class="numero rosso"><span>' + nAss + '</span>Assenti</div></div>'
      + '<div class="colonne"><section class="riquadro"><h2>Assenti</h2>' + elenco(r.assenti) + '</section>'
      + '<section class="riquadro"><h2>Fuori sede</h2>' + elenco(r.fuori) + '</section>'
      + '<section class="riquadro"><h2>Presenti in sede</h2><ul>' + (r.presenti.map(function (m) {
        return '<li><a href="#militare/' + esc(m.id) + '">' + esc(m.nome) + '</a> ' + m.impieghi.map(function (i) { return etichetta(i.codice, i.localita); }).join(' ') + '</li>';
      }).join('') || '<li class="vuoto">Nessuno.</li>') + '</ul></section></div>'
      + '<section class="riquadro"><h2>Scadenze <a class="piccolo" href="#scadenze">vedi tutte</a></h2>'
      + (r.mancanti ? '<p class="avviso">' + r.mancanti + ' scadenze obbligatorie non ancora registrate.</p>' : '')
      + '<table class="tabella"><tr><th>Militare</th><th>Tipo</th><th>Scadenza</th><th>Stato</th></tr>'
      + r.scadute.map(function (s) { return '<tr class="st-scaduta"><td>' + esc(s.militare) + '</td><td>' + esc(s.tipo) + '</td><td>' + it(s.data_scadenza) + '</td><td>SCADUTA</td></tr>'; }).join('')
      + r.inScadenza.map(function (s) { return '<tr class="st-in_scadenza"><td>' + esc(s.militare) + '</td><td>' + esc(s.tipo) + '</td><td>' + it(s.data_scadenza) + '</td><td>in scadenza</td></tr>'; }).join('')
      + (!r.scadute.length && !r.inScadenza.length ? '<tr><td colspan="4" class="vuoto">Nessuna scadenza imminente.</td></tr>' : '')
      + '</table></section>';
    main(h);
  });
}

// ---------------------------------------------------------------- ruolino
var RU = null; // stato del ruolino aperto

function vistaRuolino(anno, mese) {
  var o = oggi().split('-');
  anno = Number(anno) || Number(o[0]); mese = Number(mese) || Number(o[1]);
  var filtro = sessionStorage.getItem('filtroRuolino') || 'tutti';
  api('ruolino', { anno: anno, mese: mese }).then(function (r) {
    RU = { anno: anno, mese: mese, giorni: r.giorni, militari: r.militari, celle: {} };
    r.impieghi.forEach(function (i) { (RU.celle[i.m + '|' + i.d] = RU.celle[i.m + '|' + i.d] || []).push(i); });
    var mil = r.militari.filter(function (m) { return filtro === 'tutti' || m.stato === filtro; });
    var prec = mese === 1 ? [anno - 1, 12] : [anno, mese - 1], succ = mese === 12 ? [anno + 1, 1] : [anno, mese + 1];
    var mod = puo('Operatore'), oggiS = oggi();
    var h = '<div class="intestazione"><h1>Ruolino ' + MESI[mese] + ' ' + anno + '</h1><div class="naviga">'
      + '<a class="bottone" href="#ruolino/' + prec[0] + '/' + prec[1] + '">&larr;</a><a class="bottone" href="#ruolino">Mese corrente</a>'
      + '<a class="bottone" href="#ruolino/' + succ[0] + '/' + succ[1] + '">&rarr;</a>'
      + '<select onchange="sessionStorage.setItem(\'filtroRuolino\',this.value);ricarica()">' + opzioni([['tutti', 'Tutti'], ['EFF', 'Solo effettivi'], ['EXT', 'Solo extra']], filtro) + '</select>'
      + '<button class="bottone" onclick="esporta(' + anno + ',' + mese + ')">Esporta Excel</button>'
      + '<button class="bottone" onclick="window.print()">Stampa</button>'
      + (mod ? '<button class="bottone primario" onclick="dialogoPeriodo()">Inserisci periodo</button>' : '') + '</div></div>';
    if (mod) {
      h += '<div class="pennello"><strong>Inserimento rapido:</strong><select id="pn-tipo" onchange="cambiaPennello()"><option value="">— clic su cella apre il dettaglio —</option>'
        + CFG.codiciAttivi.map(function (k) { return '<option value="' + esc(k.codice) + '">' + esc(k.codice + (k.descrizione ? ' - ' + k.descrizione : '')) + '</option>'; }).join('')
        + '<option value="__cancella">✖ CANCELLA casella</option></select><input id="pn-loc" placeholder="localita\' (facoltativa)" size="14">'
        + '<label class="check"><input type="checkbox" id="pn-sost" checked> sostituisci codici esistenti</label>'
        + '<span class="aiuto">Scegli un codice e clicca sulle caselle (anche trascinando).</span></div>';
    }
    h += '<div class="contenitore-griglia"><table class="griglia" id="griglia"><thead><tr><th class="fisso c1">N.</th><th class="fisso c2">Grado</th><th class="fisso c3">Cognome e nome</th>'
      + r.giorni.map(function (g) { return '<th class="' + (g.festivo ? 'festivo' : '') + (g.data === oggiS ? ' oggi' : '') + '">' + g.sett + '<br>' + g.giorno + '</th>'; }).join('')
      + '</tr></thead><tbody>';
    var n = 0;
    mil.forEach(function (m) {
      h += '<tr><td class="fisso c1">' + (m.stato === 'EFF' ? ++n : '<small>EXTRA</small>') + '</td><td class="fisso c2">' + esc(m.grado) + '</td>'
        + '<td class="fisso c3"><a href="#militare/' + esc(m.id) + '" title="' + esc(m.incarico) + '">' + esc(m.cognome + ' ' + m.nome) + '</a></td>'
        + r.giorni.map(function (g) { return htmlCella(m, g); }).join('') + '</tr>';
    });
    if (!mil.length) h += '<tr><td colspan="40" class="vuoto">Nessun militare in forza in questo mese.</td></tr>';
    h += '</tbody><tfoot><tr><td class="fisso c1"></td><td class="fisso c2"></td><td class="fisso c3"><strong>Presenti in sede</strong></td>'
      + r.giorni.map(function (g) { return '<td class="totale" data-tot="' + g.data + '"></td>'; }).join('') + '</tr></tfoot></table></div>'
      + '<h3>Legenda</h3><div class="legenda">' + CFG.codiciAttivi.map(function (k) { return etichetta(k.codice) + ' ' + esc(k.descrizione); }).join(' &nbsp; ') + '</div>';
    main(h);
    RU.mil = mil;
    aggiornaTotali();
    collegaGriglia();
  });
}

function inForzaIl(m, d) {
  if (m.data_ingresso && d < m.data_ingresso) return false;
  if (m.data_uscita && d > m.data_uscita) return false;
  return true;
}

function htmlCella(m, g) {
  var lista = RU.celle[m.id + '|' + g.data] || [];
  var reali = lista.filter(function (i) { return i.c !== 'NOTA'; });
  var k = reali.length ? codice(reali[0].c) : null;
  var note = lista.filter(function (i) { return i.n; }).map(function (i) { return i.n; });
  var titolo = reali.map(function (i) { return i.c + (i.l ? ' ' + i.l : '') + ' - ' + codice(i.c).descrizione; }).concat(note).join('\n');
  var cls = 'cella' + (g.festivo ? ' festivo' : '') + (inForzaIl(m, g.data) ? '' : ' fuori');
  return '<td class="' + cls + '" data-m="' + esc(m.id) + '" data-d="' + g.data + '"' + (k ? ' style="background:' + esc(k.colore_sfondo) + ';color:' + esc(k.colore_testo) + '"' : '')
    + (titolo ? ' title="' + esc(titolo) + '"' : '') + '>' + esc(reali.map(function (i) { return i.c + (i.l ? ' ' + i.l : ''); }).join(' + '))
    + (note.length ? '<span class="nota">●</span>' : '') + '</td>';
}

function aggiornaTotali() {
  RU.giorni.forEach(function (g) {
    var n = 0;
    RU.mil.forEach(function (m) {
      if (!inForzaIl(m, g.data)) return;
      var lista = RU.celle[m.id + '|' + g.data] || [];
      if (lista.every(function (i) { return si(codice(i.c).presente_in_sede); })) n++;
    });
    var td = document.querySelector('td[data-tot="' + g.data + '"]');
    if (td) td.textContent = n;
  });
}

function sostituisciCella(mId, data, lista) {
  RU.celle[mId + '|' + data] = lista;
  var td = document.querySelector('td.cella[data-m="' + mId + '"][data-d="' + data + '"]');
  var m = RU.militari.filter(function (x) { return x.id === mId; })[0];
  var g = RU.giorni.filter(function (x) { return x.data === data; })[0];
  if (td && m && g) td.outerHTML = htmlCella(m, g);
  aggiornaTotali();
}

var dipingendo = false;
function cambiaPennello() {
  var v = document.getElementById('pn-tipo').value, s = document.getElementById('pn-tipo');
  var k = CFG.codiciMap[v];
  s.style.background = k ? k.colore_sfondo : ''; s.style.color = k ? k.colore_testo : '';
  document.getElementById('griglia').classList.toggle('pennello-attivo', !!v);
}

function applicaPennello(td) {
  var tipo = document.getElementById('pn-tipo').value;
  if (!tipo || td.dataset.inCorso) return;
  td.dataset.inCorso = '1'; td.style.opacity = '0.5';
  var base = { militare_id: td.dataset.m, data: td.dataset.d };
  var p = tipo === '__cancella' ? api('cellaElimina', base, true)
    : api('cellaSalva', Object.assign(base, { codice: tipo, localita: document.getElementById('pn-loc').value, sostituisci: document.getElementById('pn-sost').checked }), true);
  p.then(function (lista) {
    if (tipo !== '__cancella' && si(codice(tipo).perde_forza)) { document.getElementById('pn-tipo').value = ''; avviso('Non piu\' in forza da quel giorno'); ricarica(); return; }
    sostituisciCella(base.militare_id, base.data, lista);
  },
    function () { td.style.opacity = ''; delete td.dataset.inCorso; });
}

function collegaGriglia() {
  var gr = document.getElementById('griglia');
  if (!gr) return;
  var pn = document.getElementById('pn-tipo');
  gr.addEventListener('mousedown', function (ev) {
    var td = ev.target.closest('td.cella');
    if (!td || !pn || !pn.value) return;
    ev.preventDefault(); dipingendo = true; applicaPennello(td);
  });
  gr.addEventListener('mouseover', function (ev) {
    if (!dipingendo) return;

        + '<h3>Cancella un periodo</h3><div class="naviga">Cancella tutti i codici dal ' + it(data) + ' al <input type="date" id="canc-al"> '
        + '<button type="button" id="canc-btn" class="bottone pericolo" onclick="cancellaPeriodoDa(' + J(mId) + ',' + J(data) + ')">Cancella</button></div>'
        + '<p class="aiuto">Lascia la data vuota per cancellare da questo giorno in avanti.</p>';
    }

      d.militare_id = mId; d.data = data; d.sostituisci = d.sostituisci === 'SI'; d.escludiFestivi = d.escludiFestivi === 'SI';

function cancellaPeriodoDa(mId, data) {

function dialogoPeriodo(mId) {
  var caricaMil = RU ? Promise.resolve(RU.militari) : api('militari');
  caricaMil.then(function (militari) {

      { n: 'codice', l: 'Codice', t: 'select', o: [['', '(cancella: tutti i codici)']].concat(CFG.codiciAttivi.map(function (k) { return [k.codice, k.codice + (k.descrizione ? ' - ' + k.descrizione : '')]; })), v: CFG.codiciAttivi.length ? CFG.codiciAttivi[0].codice : '' },

      + '<div class="contenitore-griglia" style="max-height:none"><table class="tabella matrice"><tr><th>Militare</th>' + r.tipi.map(function (t) { return '<th>' + esc(t.nome) + (t.validita_mesi ? '<br><small>' + esc(t.validita_mesi) + ' mesi</small>' : '') + '</th>'; }).join('') + '</tr>'
      + r.militari.map(function (m) {
        return '<tr><td><a href="#militare/' + esc(m.id) + '">' + esc(m.grado + ' ' + m.cognome) + '</a></td>' + r.tipi.map(function (t) {
          var s = r.ultime[m.id + '|' + t.nome];
          var stato = s ? s.stato : (si(t.obbligatoria) ? 'mancante' : '');
          var dentro = s ? (mod ? '<button class="link" onclick="dialogoScadenza(' + J(s) + ')">' + (it(s.data_scadenza) || 'senza data') + '</button>' : (it(s.data_scadenza) || 'senza data'))
            + (s.documento_url ? ' <a target="_blank" href="' + esc(s.documento_url) + '" title="' + esc(s.documento_nome) + '">📎</a>' : '')
            + (mod ? ' <button class="link piccolo" title="registra rinnovo" onclick="dialogoScadenza(null,' + J(m.id) + ',' + J(t.nome) + ')">↻</button>' : '')
            : (mod ? '<button class="link vuoto" onclick="dialogoScadenza(null,' + J(m.id) + ',' + J(t.nome) + ')">+</button>' : '');
          return '<td class="st-' + stato + '">' + dentro + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</table></div>';
    main(h);
  });
}

function dialogoScadenza(s, mId, tipo) {
  var caricaMil = MIL_CACHE.length ? Promise.resolve(MIL_CACHE) : api('militari', {}, true);
  caricaMil.then(function (mil) {
    MIL_CACHE = mil;
    s = s || { militare_id: mId || '', tipo: tipo || '', data_esecuzione: oggi() };
    apriDialogo(modulo(s.id ? 'Modifica scadenza' : 'Registra scadenza', [
      { n: 'militare_id', l: 'Militare', t: 'select', o: mil.filter(function (m) { return m.stato !== 'PER'; }).map(function (m) { return [m.id, nomeMil(m)]; }), v: s.militare_id },
      { n: 'tipo', l: 'Tipo', t: 'select', o: CFG.tipiScadenza.map(function (t) { return [t.nome, t.nome + (t.validita_mesi ? ' (' + t.validita_mesi + ' mesi)' : '')]; }), v: s.tipo },
      { n: 'data_esecuzione', l: 'Eseguita il', t: 'date', v: s.data_esecuzione },
      { n: 'data_scadenza', l: 'Scade il', t: 'date', v: s.id ? s.data_scadenza : '', aiuto: "Se vuota e il tipo ha una validita', viene calcolata in automatico." },
      { n: 'esito', l: 'Esito', v: s.esito }, { n: 'note', l: 'Note', v: s.note },
      { n: 'file', l: 'Documento (PDF, foto...) da allegare su Google Drive', t: 'file', aiuto: s.documento_nome ? 'Gia\' allegato: ' + s.documento_nome + ' (un nuovo file lo sostituisce nel registro)' : '' }
    ], '<button class="primario" id="salva">Salva</button> <button type="button" onclick="chiudiDialogo()">Annulla</button>'
      + (s.id ? ' <button type="button" class="pericolo" onclick="eliminaScadenze([' + J(s.id) + '])">Elimina</button>' : '')));
    alSalva(function (d) {
      d.id = s.id || '';
      return leggiFile(document.querySelector('#modulo [name=file]')).then(function (f) {
        d.file = f;
        return api('scadenzaSalva', d).then(function () { chiudiDialogo(); avviso('Salvato'); ricarica(); });
      });
    });
  });
}
function eliminaScadenze(ids) {
  if (ids.length && confirm('Eliminare ' + (ids.length > 1 ? ids.length + ' scadenze' : 'la scadenza') + ' (e i documenti allegati)?'))
    api('scadenzaElimina', { ids: ids }).then(function (n) { chiudiDialogo(); avviso('Eliminate ' + n + ' scadenze'); ricarica(); });
}

// ---------------------------------------------------------------- configurazione
var CONFIG_TAB = {
  Codici: { titolo: 'Codici e colori', chiave: 'codice', lista: function () { return CFG.codici; } },
  TipiScadenza: { titolo: 'Tipi di scadenza', chiave: 'nome', lista: function () { return CFG.tipiScadenza; } },
  Contatori: { titolo: 'Contatori licenze / recuperi', chiave: 'nome', lista: function () { return CFG.contatori; } },
  Gradi: { titolo: 'Gradi', chiave: 'sigla', lista: function () { return CFG.gradi; } },
  Orario: { titolo: 'Orario di lavoro' }
};

function vistaConfig(tab) {
  tab = CONFIG_TAB[tab] ? tab : 'Codici';
  var adm = puo('Amministratore'), def = CONFIG_TAB[tab];
  var h = '<div class="schede">' + Object.keys(CONFIG_TAB).map(function (k) { return '<a class="' + (k === tab ? 'attiva' : '') + '" href="#config/' + k + '">' + CONFIG_TAB[k].titolo + '</a>'; }).join('') + '</div>'
    + '<div class="intestazione"><h1>' + def.titolo + '</h1><div class="naviga">'
    + (adm && tab !== 'Orario' ? bottoneSel('cfg', 'Elimina selezionati', 'eliminaConfigSel') + '<button class="bottone primario" onclick="dialogoConfig(' + J(tab) + ')">+ Aggiungi</button>' : '')
    + (adm ? '<button class="bottone" onclick="backupOra()">Backup ora</button>' : '') + '</div></div><table class="tabella">';
  var mod = function (v) { return adm ? '<button class="link" onclick="dialogoConfig(' + J(tab) + ',' + J(v) + ')">modifica</button>' : ''; };
  var cs = function (v) { return adm ? '<td>' + sel('cfg', v) + '</td>' : ''; }, ct = adm ? '<th>' + selTutti('cfg') + '</th>' : '';
  CONFIG_ATTIVA = tab;
  if (tab === 'Codici') {
    h += '<tr>' + ct + '<th>Codice</th><th>Descrizione</th><th>Categoria</th><th>Presente in sede</th><th>Scala da</th><th>Attivo</th><th></th></tr>' + CFG.codici.map(function (k) {
      return '<tr class="' + (si(k.attivo) ? '' : 'spento') + '">' + cs(k.codice) + '<td>' + etichetta(k.codice) + (si(k.perde_forza) ? ' <small title="fa perdere la forza">⇥ perde la forza</small>' : '') + '</td><td>' + esc(k.descrizione) + '</td><td>' + esc(CATEGORIE[k.categoria] || k.categoria) + '</td><td>' + (si(k.presente_in_sede) ? "si'" : 'no') + '</td><td>'
        + (k.contatore ? esc(k.contatore) + ' (' + (si(k.scala_orario) ? 'secondo orario' : num(k.quantita_giorno) + '/giorno') + ')' : '') + '</td><td>' + (si(k.attivo) ? "si'" : 'no') + '</td><td>' + mod(k.codice) + '</td></tr>';
    }).join('');
  } else if (tab === 'TipiScadenza') {
    h += '<tr>' + ct + '<th>Nome</th><th>Validita\'</th><th>Preavviso</th><th>Obbligatoria</th><th>Descrizione</th><th></th></tr>' + CFG.tipiScadenza.map(function (t) {
      return '<tr>' + cs(t.nome) + '<td>' + esc(t.nome) + '</td><td>' + (t.validita_mesi ? esc(t.validita_mesi) + ' mesi' : 'data inserita a mano') + '</td><td>' + esc(t.preavviso_giorni) + ' gg</td><td>' + (si(t.obbligatoria) ? "si'" : 'no') + '</td><td>' + esc(t.descrizione) + '</td><td>' + mod(t.nome) + '</td></tr>';
    }).join('');
  } else if (tab === 'Contatori') {
    h += '<tr>' + ct + '<th>Nome</th><th>Unita\'</th><th>Attivo</th><th></th></tr>' + CFG.contatori.map(function (c) {
      return '<tr>' + cs(c.nome) + '<td>' + esc(c.nome) + '</td><td>' + (c.unita === 'ORE' ? 'Ore' : 'Giorni') + '</td><td>' + (si(c.attivo) ? "si'" : 'no') + '</td><td>' + mod(c.nome) + '</td></tr>';
    }).join('');
  } else if (tab === 'Gradi') {
    h += '<tr>' + ct + '<th>Sigla</th><th>Descrizione</th><th>Ordine</th><th></th></tr>' + CFG.gradi.map(function (g) {
      return '<tr>' + cs(g.sigla) + '<td>' + esc(g.sigla) + '</td><td>' + esc(g.descrizione) + '</td><td>' + esc(g.ordine) + '</td><td>' + mod(g.sigla) + '</td></tr>';
    }).join('');
  } else {
    var o = CFG.orario;
    h += '<tr><th>Lun</th><th>Mar</th><th>Mer</th><th>Gio</th><th>Ven</th><th>Sab</th><th>Dom</th><th>Festivi</th><th></th></tr><tr>'
      + ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'].map(function (g) { return '<td>' + num(o[g]) + ' h</td>'; }).join('')
      + '<td>' + (si(o.festivi_zero) ? '0 h' : 'come il giorno') + '</td><td>' + (adm ? '<button class="link" onclick="dialogoOrario()">modifica</button>' : '') + '</td></tr>';
  }
  main(h + '</table>' + (tab === 'Orario' ? '<p class="aiuto">I codici con "scala secondo orario" (RC, RC FEST) scalano dalle Ore di recupero le ore previste per quel giorno.</p>' : ''));
}

function dialogoConfig(tab, valore) {
  var def = CONFIG_TAB[tab];
  var o = valore ? def.lista().filter(function (x) { return x[def.chiave] === valore; })[0] : {};
  var campi = {
    Codici: [{ n: 'codice', l: 'Codice', req: true, v: o.codice }, { n: 'descrizione', l: 'Descrizione', v: o.descrizione },
      { n: 'categoria', l: 'Categoria', t: 'select', o: Object.keys(CATEGORIE).map(function (k) { return [k, CATEGORIE[k]]; }), v: o.categoria || 'ALT' },
      { n: 'colore_sfondo', l: 'Colore sfondo', t: 'color', v: o.colore_sfondo || '#FFFFFF' },
      { n: 'colore_testo', l: 'Colore testo', t: 'color', v: o.colore_testo || '#000000' },
      { n: 'presente_in_sede', l: 'Conta come presente in sede', t: 'checkbox', v: valore ? o.presente_in_sede : 'SI' },
      { n: 'perde_forza', l: "Fa perdere la forza (congedo, trasferimento): dal giorno inserito il militare non e' piu' in forza", t: 'checkbox', v: o.perde_forza },
      { n: 'contatore', l: 'Scala dal contatore', t: 'select', o: [['', '— nessuno —']].concat(CFG.contatori.map(function (c) { return c.nome; })), v: o.contatore },
      { n: 'quantita_giorno', l: "Quantita' per giorno", t: 'number', v: o.quantita_giorno || 1 },
      { n: 'scala_orario', l: "Scala le ore secondo l'orario di lavoro (invece della quantita' fissa)", t: 'checkbox', v: o.scala_orario },
      { n: 'ordine', l: "Ordine nell'elenco", t: 'number', v: o.ordine || 500 },
      { n: 'attivo', l: 'Attivo', t: 'checkbox', v: valore ? o.attivo : 'SI' }],
    TipiScadenza: [{ n: 'nome', l: 'Nome', req: true, v: o.nome },
      { n: 'validita_mesi', l: "Validita' (mesi)", t: 'number', v: o.validita_mesi, aiuto: 'Se indicata, la scadenza si calcola dalla data di esecuzione.' },
      { n: 'preavviso_giorni', l: 'Preavviso (giorni)', t: 'number', v: o.preavviso_giorni || 30 },
      { n: 'obbligatoria', l: 'Obbligatoria per tutti', t: 'checkbox', v: o.obbligatoria },
      { n: 'descrizione', l: 'Descrizione', v: o.descrizione }, { n: 'ordine', l: 'Ordine', t: 'number', v: o.ordine || 500 }],
    Contatori: [{ n: 'nome', l: 'Nome', req: true, v: o.nome }, { n: 'unita', l: "Unita'", t: 'select', o: [['GG', 'Giorni'], ['ORE', 'Ore']], v: o.unita },
      { n: 'ordine', l: 'Ordine', t: 'number', v: o.ordine || 500 }, { n: 'attivo', l: 'Attivo', t: 'checkbox', v: valore ? o.attivo : 'SI' }],
    Gradi: [{ n: 'sigla', l: 'Sigla', req: true, v: o.sigla }, { n: 'descrizione', l: 'Descrizione', v: o.descrizione },
      { n: 'ordine', l: 'Ordine gerarchico', t: 'number', v: o.ordine || 500, aiuto: "Numero piu' basso = grado piu' alto." }]
  }[tab];
  apriDialogo(modulo(def.titolo + (valore ? ' - modifica' : ' - nuovo'), campi,
    '<button class="primario" id="salva">Salva</button> <button type="button" onclick="chiudiDialogo()">Annulla</button>'
    + (valore ? ' <button type="button" class="pericolo" onclick="eliminaConfig(' + J(tab) + ',[' + J(valore) + '])">Elimina</button>' : '')));
  alSalva(function (d) {
    return api('configSalva', { tabella: tab, originale: valore || '', oggetto: d }).then(function () {
      chiudiDialogo(); avviso('Salvato'); return ricaricaConfig().then(ricarica);
    });
  });
}
function eliminaConfig(tab, valori) {
  if (!valori.length || !confirm('Eliminare ' + valori.join(', ') + '?')) return;
  api('configElimina', { tabella: tab, valori: valori }).then(function (r) {
    chiudiDialogo();
    avviso('Eliminati: ' + r.eliminati.join(', '));
    if (r.usati.length) avviso('Non eliminati perche\' in uso (si possono disattivare): ' + r.usati.join(', '), true);
    return ricaricaConfig().then(ricarica);
  });
}
var CONFIG_ATTIVA = "Codici";
function eliminaConfigSel(valori) { eliminaConfig(CONFIG_ATTIVA, valori); }
function dialogoOrario() {
  var o = CFG.orario, nomi = { lun: "Lunedi'", mar: "Martedi'", mer: "Mercoledi'", gio: "Giovedi'", ven: "Venerdi'", sab: 'Sabato', dom: 'Domenica' };
  apriDialogo(modulo('Orario di lavoro (ore per giorno)', Object.keys(nomi).map(function (g) { return { n: g, l: nomi[g], t: 'number', v: o[g] }; })
    .concat([{ n: 'festivi_zero', l: 'Nei giorni festivi non scala ore', t: 'checkbox', v: o.festivi_zero }])));
  alSalva(function (d) { return api('orarioSalva', d).then(function () { chiudiDialogo(); avviso('Salvato'); return ricaricaConfig().then(ricarica); }); });
}
function backupOra() {
  api('backupOra').then(function (r) { apriDialogo('<h2>Backup creato</h2><p><a class="bottone primario" target="_blank" href="' + esc(r.url) + '">' + esc(r.nome) + '</a></p>'); });
}

// ---------------------------------------------------------------- importazione
function vistaImporta() {
  main('<div class="riquadro modulo">' + modulo('Importa il brogliaccio Excel', [
    { n: 'file', l: 'File Excel (.xlsx)', t: 'file', accept: '.xlsx,.xls' },
    { n: 'anno', l: 'Anno del brogliaccio', t: 'number', v: oggi().slice(0, 4), req: true },
    { n: 'foglio', l: 'Nome del foglio', v: 'BROGLIACCIO', req: true }
  ], '<button class="primario" id="salva">Importa</button>')
    + '<p class="aiuto">Legge anagrafica e codici giornalieri. I militari gia\' presenti (stesso cognome e nome) vengono aggiornati; il ruolino del periodo contenuto nel file viene sostituito. Il file viene salvato su Drive nella cartella "Import".</p><div id="esito"></div></div>');
  alSalva(function (d) {
    return leggiFile(document.querySelector('#modulo [name=file]')).then(function (f) {
      if (!f) { avviso('Scegli un file', true); return; }
      d.file = f;
      return api('importa', d).then(function (righe) {
        document.getElementById('esito').innerHTML = '<h2>Esito</h2><ul>' + righe.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
        MIL_CACHE = []; return ricaricaConfig();
      });
    });
  });
}

// ---------------------------------------------------------------- utenti e registro
function vistaUtenti() {
  api('utenti').then(function (lista) {
    main('<div class="intestazione"><h1>Utenti</h1><div class="naviga">' + bottoneSel('ute', 'Rimuovi selezionati', 'eliminaUtenti') + '<button class="bottone primario" onclick="dialogoUtente()">+ Aggiungi utente</button></div></div>'
      + '<p class="aiuto">Aggiungendo un utente, il Foglio dati e la cartella Drive vengono condivisi automaticamente con il suo account Google: '
      + 'in modifica per Amministratori e Operatori, in sola lettura per Consultazione. Rimuovendolo, la condivisione viene tolta.</p>'
      + '<table class="tabella"><tr><th>' + selTutti('ute') + '</th><th>Email</th><th>Nome</th><th>Ruolo</th><th></th></tr>' + lista.map(function (u) {
        return '<tr><td>' + (u.email !== UTENTE.email ? sel('ute', u.email) : '') + '</td><td>' + esc(u.email) + '</td><td>' + esc(u.nome) + '</td><td>' + esc(u.ruolo) + '</td><td><button class="link" onclick="dialogoUtente(' + J(u) + ')">modifica</button>'
          + '</td></tr>';
      }).join('') + '</table>');
  });
}
function dialogoUtente(u) {
  u = u || { ruolo: 'Operatore' };
  apriDialogo(modulo(u.email ? 'Modifica utente' : 'Nuovo utente', [
    { n: 'email', l: 'Email (account Google)', t: 'email', req: true, v: u.email },
    { n: 'nome', l: 'Nome da mostrare', v: u.nome },
    { n: 'ruolo', l: 'Ruolo', t: 'select', o: [['Amministratore', 'Amministratore - tutto'], ['Operatore', 'Operatore - ruolino, anagrafica, licenze, scadenze'], ['Consultazione', 'Consultazione - sola lettura']], v: u.ruolo }
  ]));
  if (u.email) document.querySelector('#modulo [name=email]').readOnly = true;
  alSalva(function (d) { return api('utenteSalva', d).then(function () { chiudiDialogo(); avviso('Utente salvato e file condivisi'); ricarica(); }); });
}
function eliminaUtenti(emails) {
  if (emails.length && confirm('Rimuovere ' + emails.join(', ') + ' e togliere la condivisione dei file?')) api('utenteElimina', { emails: emails }).then(function () { ricarica(); });
}
function vistaRegistro() {
  api('registro').then(function (r) {
    main('<h1>Registro modifiche</h1><p class="aiuto">Ultime 500 operazioni.</p><table class="tabella"><tr><th>Quando</th><th>Utente</th><th>Operazione</th></tr>'
      + r.map(function (x) { return '<tr><td>' + esc(x.quando) + '</td><td>' + esc(x.utente) + '</td><td>' + esc(x.azione) + '</td></tr>'; }).join('') + '</table>');
  });
}

avvio();
</script>
