<script>
/* Ruolino - interfaccia web (Google Apps Script) */
var CFG = null, UTENTE = null, LIVELLO = 0;
var LIVELLI = { Consultazione: 1, Operatore: 2, Amministratore: 3 };
var CATEGORIE = { SER: 'Servizio in sede', ATT: "Attivita' / visite in sede", FUO: 'Fuori sede', ASS: 'Assenza', ALT: 'Altro / note' };
var STATI_MIL = { EFF: 'Effettivo', EXT: 'Extra / aggregato', PER: 'Perso dalla forza' };
var MESI = ['', 'Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
var SETT = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];

// ---------------------------------------------------------------- utilita'
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function oggi() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function it(s) { if (!s) return ''; var p = String(s).split('-'); return esc(p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s); }
function piuGiorni(s, n) { var p = s.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
function giornoSett(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); }
function num(v) { if (v === '' || v === null || v === undefined) return ''; var n = Number(v); return isNaN(n) ? esc(v) : String(Math.round(n * 100) / 100).replace('.', ','); }
function si(v) { return /^(si|sì|true|1|x)$/i.test(String(v || '').trim()); }
function puo(ruolo) { return LIVELLO >= LIVELLI[ruolo]; }
function codice(c) { return CFG.codiciMap[c] || { codice: c, colore_sfondo: '#FFFFFF', colore_testo: '#000000', descrizione: '' }; }
function etichetta(c, loc) { var k = codice(c); return '<span class="etichetta" style="background:' + esc(k.colore_sfondo) + ';color:' + esc(k.colore_testo) + '" title="' + esc(k.descrizione) + '">' + esc(c + (loc ? ' ' + loc : '')) + '</span>'; }
function opzioni(lista, sel) {
  return lista.map(function (o) {
    var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
    var s = Array.isArray(sel) ? sel.indexOf(String(v)) >= 0 : String(v) === String(sel);
    return '<option value="' + esc(v) + '"' + (s ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
}
/** argomento sicuro per onclick="..." */
function J(v) { return esc(JSON.stringify(v === undefined ? null : v)); }
/** selezione multipla: casella per riga, casella "tutti" in intestazione, pulsante elimina */
function sel(gruppo, valore) { return '<input type="checkbox" class="sel" data-g="' + gruppo + '" value="' + esc(valore) + '" onchange="contaSel(\'' + gruppo + '\')">'; }
function selTutti(gruppo) { return '<input type="checkbox" title="seleziona tutti" onchange="selezionaTutti(\'' + gruppo + '\', this.checked)">'; }
function selezionaTutti(gruppo, v) { document.querySelectorAll('input.sel[data-g="' + gruppo + '"]').forEach(function (c) { c.checked = v; }); contaSel(gruppo); }
function selezionati(gruppo) { return Array.prototype.map.call(document.querySelectorAll('input.sel[data-g="' + gruppo + '"]:checked'), function (c) { return c.value; }); }
function contaSel(gruppo) {
  var n = selezionati(gruppo).length;
  document.querySelectorAll('button[data-gsel="' + gruppo + '"]').forEach(function (b) { b.hidden = !n; b.textContent = b.dataset.testo + ' (' + n + ')'; });
}
function bottoneSel(gruppo, testo, funzione, suffisso) {
  return '<button type="button" class="bottone pericolo" hidden id="elimina-' + gruppo + (suffisso || '') + '" data-gsel="' + gruppo + '" data-testo="' + esc(testo) + '" onclick="' + funzione + '(selezionati(\'' + gruppo + '\'))">' + esc(testo) + '</button>';
}
function nomeMil(m) { return (m.grado + ' ' + m.cognome + ' ' + m.nome).trim(); }

var TOKEN = '';
try { TOKEN = sessionStorage.getItem('ruolinoToken') || ''; } catch (e) { TOKEN = ''; }
function salvaToken(t) { TOKEN = t || ''; try { if (t) sessionStorage.setItem('ruolinoToken', t); else sessionStorage.removeItem('ruolinoToken'); } catch (e) { /* niente */ } }

var ATTESE = 0, TIMER_ATTESA = null;
function attesa(si) {
  ATTESE += si ? 1 : -1; if (ATTESE < 0) ATTESE = 0;
  clearTimeout(TIMER_ATTESA);
  if (ATTESE) TIMER_ATTESA = setTimeout(function () { document.getElementById('attesa').hidden = false; }, 350);
  else document.getElementById('attesa').hidden = true;
}

function api(azione, dati, silenzioso) {
  if (!silenzioso) attesa(true);
  dati = dati || {};
  dati._token = TOKEN;
  return new Promise(function (ok, ko) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (!silenzioso) attesa(false);
        if (r && r.login) { salvaToken(''); mostraLogin(); ko(new Error(r.errore)); return; }
        if (r && r.cambio) { mostraCambio(); ko(new Error(r.errore)); return; }
        if (r && r.errore) { avviso(r.errore, true); ko(new Error(r.errore)); } else ok(r ? r.ok : null);
      })
      .withFailureHandler(function (e) {
        if (!silenzioso) attesa(false);
        avviso('Errore: ' + (e && e.message ? e.message : e), true); ko(e);
      })
      .api(azione, dati);
  });
}

function avviso(testo, errore) {
  var d = document.createElement('div');
  d.className = 'msg' + (errore ? ' error' : '');
  d.textContent = testo;
  document.getElementById('avvisi').appendChild(d);
  setTimeout(function () { d.remove(); }, errore ? 8000 : 3500);
}

function leggiFile(input) {
  var f = input && input.files && input.files[0];
  if (!f) return Promise.resolve(null);
  if (f.size > 20 * 1024 * 1024) { avviso('File troppo grande (massimo 20 MB)', true); return Promise.reject(new Error('file')); }
  return new Promise(function (ok) {
    var r = new FileReader();
    r.onload = function () { ok({ nome: f.name, mime: f.type, base64: String(r.result).split(',')[1] }); };
    r.readAsDataURL(f);
  });
}

// ---------------------------------------------------------------- dialoghi e moduli
function apriDialogo(html) { document.getElementById('dlg-corpo').innerHTML = html; var d = document.getElementById('dlg'); if (!d.open) d.showModal(); }
function chiudiDialogo() { var d = document.getElementById('dlg'); if (d.open) d.close(); }

/** campi: [{n, l, t, v, o (opzioni), aiuto, req}] */
function modulo(titolo, campi, pulsanti) {
  var h = '<h2>' + esc(titolo) + '</h2><form id="modulo" onsubmit="return false">';
  campi.forEach(function (c) {
    var t = c.t || 'text', v = c.v === undefined || c.v === null ? '' : c.v, id = 'f_' + c.n;
    h += '<div class="campo">';
    if (t === 'checkbox') {
      h += '<label class="check"><input type="checkbox" name="' + c.n + '"' + (si(v) || v === true ? ' checked' : '') + '> ' + esc(c.l) + '</label>';
    } else {
      h += '<label for="' + id + '">' + esc(c.l) + (c.req ? ' *' : '') + '</label>';
      if (t === 'select') h += '<select id="' + id + '" name="' + c.n + '">' + opzioni(c.o, v) + '</select>';
      else if (t === 'multi') h += '<select id="' + id + '" name="' + c.n + '" multiple>' + opzioni(c.o, v) + '</select>';
      else if (t === 'textarea') h += '<textarea id="' + id + '" name="' + c.n + '" rows="3">' + esc(v) + '</textarea>';
      else if (t === 'file') h += '<input id="' + id + '" type="file" name="' + c.n + '"' + (c.accept ? ' accept="' + c.accept + '"' : '') + '>';
      else h += '<input id="' + id + '" type="' + t + '" name="' + c.n + '" value="' + esc(v) + '"' + (c.req ? ' required' : '') + (t === 'number' ? ' step="any"' : '') + '>';
    }
    if (c.aiuto) h += '<small>' + esc(c.aiuto) + '</small>';
    h += '</div>';
  });
  h += '<div class="azioni">' + (pulsanti || '<button class="primario" id="salva">Salva</button> <button type="button" onclick="chiudiDialogo()">Annulla</button>') + '</div></form>';
  return h;
}

function datiModulo() {
  var f = document.getElementById('modulo'), out = {};
  Array.prototype.forEach.call(f.elements, function (el) {
    if (!el.name || el.type === 'file') return;
    if (el.type === 'checkbox') out[el.name] = el.checked ? 'SI' : 'NO';
    else if (el.multiple) out[el.name] = Array.prototype.filter.call(el.options, function (o) { return o.selected; }).map(function (o) { return o.value; });
    else out[el.name] = el.value;
  });
  return out;
}

function alSalva(fn) {
  var b = document.getElementById('salva');
  b.onclick = function () {
    var f = document.getElementById('modulo');
    if (!f.reportValidity()) return;
    b.disabled = true;
    Promise.resolve(fn(datiModulo())).then(function () { b.disabled = false; }, function () { b.disabled = false; });
  };
}

// ---------------------------------------------------------------- avvio e navigazione
function avvio() {
  if (TOKEN) entra(); else mostraLogin();
}

// uscita automatica dopo 30 minuti senza attivita' (controllata anche dal server)
var INATTIVITA = 30 * 60, TIMER_INATTIVITA = null;
function attivita() {
  if (!TOKEN) return;
  clearTimeout(TIMER_INATTIVITA);
  TIMER_INATTIVITA = setTimeout(function () {
    api('logout', {}, true).then(null, function () { /* niente */ });
    salvaToken(''); mostraLogin();
    avviso('Sei uscito automaticamente dopo ' + Math.round(INATTIVITA / 60) + ' minuti di inattivita\'.', true);
  }, INATTIVITA * 1000);
}
['click', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) { document.addEventListener(ev, attivita, { passive: true }); });

function svuotaIntestazione() {
  clearTimeout(TIMER_INATTIVITA);
  document.getElementById('menu').innerHTML = '';
  document.getElementById('utente').innerHTML = '';
  chiudiDialogo();
}

function mostraLogin() {
  svuotaIntestazione();
  main('<div class="riquadro login"><h1>Ruolino - accesso</h1>'
    + '<form id="form-login" onsubmit="return false">'
    + '<label>Nome utente<input id="login-utente" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>'
    + '<label>Password<input type="password" id="pw1" autocomplete="current-password"></label>'
    + '<button class="primario" id="btn-login">Accedi</button></form>'
    + '<p class="aiuto">Password dimenticata? Chiedi all\'amministratore una password provvisoria.</p></div>');
  var vai = function () {
    var u = document.getElementById('login-utente').value.trim(), pw = document.getElementById('pw1').value;
    if (!u || !pw) { avviso('Inserisci nome utente e password', true); return; }
    api('login', { utente: u, password: pw }).then(function (r) {
      salvaToken(r.token);
      if (r.inattivita) INATTIVITA = r.inattivita;
      if (r.cambio) mostraCambio(); else entra();
    }, function () { document.getElementById('pw1').value = ''; });
  };
  document.getElementById('btn-login').onclick = vai;
  document.getElementById('login-utente').focus();
}

/** Primo accesso con password provvisoria: va sostituita prima di entrare. */
function mostraCambio() {
  svuotaIntestazione();
  main('<div class="riquadro login"><h1>Nuova password</h1>'
    + '<p>Stai usando una password provvisoria: scegline una personale (almeno 8 caratteri, con lettere e numeri).</p>'
    + '<form onsubmit="return false"><label>Nuova password<input type="password" id="pwn1" autocomplete="new-password"></label>'
    + '<label>Ripeti la password<input type="password" id="pwn2" autocomplete="new-password"></label>'
    + '<button class="primario" id="btn-cambio">Salva ed entra</button></form>'
    + '<p><button class="link" onclick="esci()">Esci</button></p></div>');
  document.getElementById('btn-cambio').onclick = function () {
    var p1 = document.getElementById('pwn1').value;
    if (p1 !== document.getElementById('pwn2').value) { avviso('Le due password non coincidono', true); return; }
    api('cambiaPassword', { password: p1 }).then(function () { avviso('Password salvata'); entra(); });
  };
  document.getElementById('pwn1').focus();
}

function esci() {
  api('logout', {}, true).then(function () { salvaToken(''); mostraLogin(); }, function () { salvaToken(''); mostraLogin(); });
}

function dialogoCambiaPassword() {
  apriDialogo(modulo('Cambia password', [
    { n: 'vecchia', l: 'Password attuale', t: 'password', req: true },
    { n: 'password', l: 'Nuova password', t: 'password', req: true, aiuto: 'Almeno 8 caratteri, con lettere e numeri.' },
    { n: 'conferma', l: 'Ripeti la nuova password', t: 'password', req: true }
  ]));
  alSalva(function (d) {
    if (d.password !== d.conferma) { avviso('Le due password non coincidono', true); return; }
    return api('cambiaPassword', { vecchia: d.vecchia, password: d.password }).then(function () { chiudiDialogo(); avviso('Password cambiata'); });
  });
}

var MENU_COLLEGATO = false;
function entra() {
  api('avvio').then(function (r) {
    attivita();
    UTENTE = r.utente; LIVELLO = LIVELLI[UTENTE.ruolo] || 0;
    impostaConfig(r.config);
    document.getElementById('utente').innerHTML = '<span title="' + esc(UTENTE.email) + '">' + esc(UTENTE.nome || UTENTE.email) + '</span> <span class="badge">' + esc(UTENTE.ruolo) + '</span>'
      + ' <button class="link" onclick="dialogoCambiaPassword()" title="Cambia password">🔑</button> <button class="link" onclick="esci()">Esci</button>';
    var voci = [['situazione', 'Dati della forza'], ['ruolino', 'Brogliaccio'], ['militari', 'Elenco personale'], ['licenze', 'Licenze'], ['servizi', 'Servizi'], ['scadenze', 'Scadenze']];
    voci.push(['config', 'Configurazione']);
    if (puo('Amministratore')) voci.push(['importa', 'Importa Excel'], ['utenti', 'Utenti']);
    if (puo('Operatore')) voci.push(['registro', 'Registro']);
    document.getElementById('menu').innerHTML = voci.map(function (v) { return '<a href="#' + v[0] + '" data-r="' + v[0] + '" onclick="chiudiMenu()">' + v[1] + '</a>'; }).join('')
      + (CFG.cartellaUrl ? '<a href="' + esc(CFG.cartellaUrl) + '" target="_blank" title="Cartella dei file su Google Drive">Drive ↗</a>' : '');
    if (!MENU_COLLEGATO) { window.addEventListener('hashchange', instrada); MENU_COLLEGATO = true; }
    instrada();
  });
}

function impostaConfig(c) {
  CFG = c;
  CFG.codiciMap = {};
  c.codici.forEach(function (k) { CFG.codiciMap[k.codice] = k; });
  CFG.codiciAttivi = c.codici.filter(function (k) { return si(k.attivo); });
}

function ricaricaConfig() { return api('avvio', {}, true).then(function (r) { impostaConfig(r.config); }); }

function apriMenu() { document.body.classList.toggle('menu-aperto'); }
function chiudiMenu() { document.body.classList.remove('menu-aperto'); }

function instrada() {
  var p = (location.hash.replace(/^#/, '') || 'situazione').split('/');
  chiudiMenu();
  var voce = document.querySelector('#menu a[data-r="' + p[0] + '"]');
  var pag = document.getElementById('pagina-attuale'); if (pag) pag.textContent = voce ? voce.textContent : '';
  document.querySelectorAll('#menu a').forEach(function (a) { a.classList.toggle('attivo', a.dataset.r === p[0]); });
  document.body.classList.toggle('largo', ['ruolino', 'scadenze', 'licenze', 'servizi'].indexOf(p[0]) >= 0);
  var viste = { situazione: vistaSituazione, ruolino: vistaRuolino, militari: vistaMilitari, militare: vistaMilitare,
    licenze: vistaLicenze, servizi: vistaServizi, scadenze: vistaScadenze, config: vistaConfig, importa: vistaImporta, utenti: vistaUtenti, registro: vistaRegistro };
  (viste[p[0]] || vistaSituazione).apply(null, p.slice(1));
}
function ricarica() { instrada(); }
function main(html) { document.getElementById('main').innerHTML = html; }

// ---------------------------------------------------------------- situazione
function vistaSituazione(data) {
  data = data || oggi();
  api('situazione', { data: data, oggi: oggi() }).then(function (r) {
    function elenco(gruppi) {
      var k = Object.keys(gruppi).sort();
      if (!k.length) return '<p class="vuoto">Nessuno.</p>';
      return k.map(function (c) {
        return '<h3>' + etichetta(c) + ' (' + gruppi[c].length + ')</h3><ul>' + gruppi[c].map(function (m) {
          return '<li><a href="#militare/' + esc(m.id) + '">' + esc(m.nome) + '</a>' + (m.localita ? ' - ' + esc(m.localita) : '') + '</li>';
        }).join('') + '</ul>';
      }).join('');
    }
    var nAss = 0, nFuo = 0;
    Object.keys(r.assenti).forEach(function (k) { nAss += r.assenti[k].length; });
    Object.keys(r.fuori).forEach(function (k) { nFuo += r.fuori[k].length; });
    var giorni = ['domenica', "lunedi'", "martedi'", "mercoledi'", "giovedi'", "venerdi'", 'sabato'];
    var h = '<div class="intestazione"><h1>Dati della forza - ' + giorni[giornoSett(data)] + ' ' + it(data) + '</h1>'
      + '<div class="naviga"><a class="bottone" href="#situazione/' + piuGiorni(data, -1) + '">&larr;</a>'
      + '<input type="date" value="' + data + '" onchange="location.hash=\'situazione/\'+this.value">'
      + '<a class="bottone" href="#situazione/' + piuGiorni(data, 1) + '">&rarr;</a><a class="bottone" href="#situazione/' + oggi() + '">Oggi</a>'
      + '<button class="bottone primario" onclick="window.print()">Stampa</button></div></div>'
      + '<div class="riepilogo"><div class="numero"><span>' + r.forza + '</span>Forza</div>'
      + '<div class="numero verde"><span>' + r.presenti.length + '</span>Presenti in sede</div>'
      + '<div class="numero giallo"><span>' + r.servizio.length + '</span>Di servizio</div>'
      + '<div class="numero blu"><span>' + nFuo + '</span>Fuori sede</div>'
      + '<div class="numero rosso"><span>' + nAss + '</span>Assenti</div>'
      + (r.festivo ? '<div class="numero"><span>' + r.liberi.length + '</span>Liberi dal servizio</div>' : '') + '</div>'
      + (r.festivo ? '<p class="avviso">Giorno festivo: in sede conta solo chi ha un servizio o un\'attivita\' inserita.</p>' : '')
      + '<div class="colonne"><section class="riquadro"><h2>Assenti</h2>' + elenco(r.assenti) + '</section>'
      + '<section class="riquadro"><h2>Fuori sede</h2>' + elenco(r.fuori) + '</section>'
      + '<section class="riquadro"><h2>Presenti in sede</h2><ul>' + (r.presenti.map(function (m) {
        return '<li><a href="#militare/' + esc(m.id) + '">' + esc(m.nome) + '</a> ' + m.impieghi.map(function (i) { return etichetta(i.codice, i.localita); }).join(' ') + '</li>';
      }).join('') || '<li class="vuoto">Nessuno.</li>') + '</ul></section>'
      + (r.festivo ? '<section class="riquadro"><h2>Liberi dal servizio</h2><ul>' + (r.liberi.map(function (m) {
        return '<li><a href="#militare/' + esc(m.id) + '">' + esc(m.nome) + '</a></li>'; }).join('') || '<li class="vuoto">Nessuno.</li>') + '</ul></section>' : '')
      + '</div>'
      + '<section class="riquadro"><h2>Scadenze <a class="piccolo" href="#scadenze">vedi tutte</a></h2>'
      + (r.mancanti ? '<p class="avviso">' + r.mancanti + ' scadenze obbligatorie non ancora registrate.</p>' : '')
      + '<table class="tabella"><tr><th>Militare</th><th>Tipo</th><th>Scadenza</th><th>Stato</th></tr>'
      + r.scadute.map(function (s) { return '<tr class="st-scaduta"><td>' + esc(s.militare) + '</td><td>' + esc(s.tipo) + '</td><td>' + it(s.data_scadenza) + '</td><td>SCADUTA</td></tr>'; }).join('')
      + r.inScadenza.map(function (s) { return '<tr class="st-in_scadenza"><td>' + esc(s.militare) + '</td><td>' + esc(s.tipo) + '</td><td>' + it(s.data_scadenza) + '</td><td>in scadenza</td></tr>'; }).join('')
      + (!r.scadute.length && !r.inScadenza.length ? '<tr><td colspan="4" class="vuoto">Nessuna scadenza imminente.</td></tr>' : '')
      + '</table></section>'
      // foglio da stampare: un militare per riga
      + '<section class="solo-stampa"><h2>Situazione nominativa</h2><table class="tabella"><tr><th>N.</th><th>Militare</th><th>Situazione</th><th>Dettaglio</th></tr>'
      + r.elenco.map(function (e, k) { return '<tr><td>' + (k + 1) + '</td><td>' + esc(e.nome) + '</td><td>' + esc(e.stato) + '</td><td>' + esc(e.dettaglio) + '</td></tr>'; }).join('')
      + '</table><p class="piccolo">Stampato il ' + it(oggi()) + ' da ' + esc(UTENTE.nome || UTENTE.email) + '</p></section>';
    main(h);
  });
}

// ---------------------------------------------------------------- ruolino
var RU = null; // stato del ruolino aperto

function vistaRuolino(anno, mese) {
  var o = oggi().split('-');
  anno = Number(anno) || Number(o[0]); mese = Number(mese) || Number(o[1]);
  var filtro = sessionStorage.getItem('filtroRuolino') || 'tutti';
  api('ruolino', { anno: anno, mese: mese }).then(function (r) {
    RU = { anno: anno, mese: mese, giorni: r.giorni, militari: r.militari, celle: {}, archiviato: r.archiviato };
    r.impieghi.forEach(function (i) { (RU.celle[i.m + '|' + i.d] = RU.celle[i.m + '|' + i.d] || []).push(i); });
    var mil = r.militari.filter(function (m) { return filtro === 'tutti' || m.stato === filtro; });
    var prec = mese === 1 ? [anno - 1, 12] : [anno, mese - 1], succ = mese === 12 ? [anno + 1, 1] : [anno, mese + 1];
    var mod = puo('Operatore') && !r.archiviato, oggiS = oggi();
    var h = (r.archiviato ? '<p class="avviso">Anno ' + anno + ' archiviato: il brogliaccio si puo\' solo consultare.</p>' : '')
      + '<div class="intestazione"><h1>Brogliaccio ' + MESI[mese] + ' ' + anno + '</h1><div class="naviga">'
      + '<a class="bottone" href="#ruolino/' + prec[0] + '/' + prec[1] + '">&larr;</a><a class="bottone" href="#ruolino">Mese corrente</a>'
      + '<a class="bottone" href="#ruolino/' + succ[0] + '/' + succ[1] + '">&rarr;</a>'

function inForzaIl(m, d) {
  if (m.data_ingresso && d < m.data_ingresso) return false;
  if (m.data_uscita && d > m.data_uscita) return false;
  return true;
}

function htmlCella(m, g) {
  var lista = RU.celle[m.id + '|' + g.data] || [];
  var reali = lista.filter(function (i) { return i.c !== 'NOTA'; });
  var k = reali.length ? codice(reali[0].c) : null;
  var note = lista.filter(function (i) { return i.n; }).map(function (i) { return i.n; });
  var titolo = reali.map(function (i) { return i.c + (i.l ? ' ' + i.l : '') + ' - ' + codice(i.c).descrizione; }).concat(note).join('\n');
  var cls = 'cella' + (g.festivo ? ' festivo' : '') + (inForzaIl(m, g.data) ? '' : ' fuori');
  return '<td class="' + cls + '" data-m="' + esc(m.id) + '" data-d="' + g.data + '"' + (k ? ' style="background:' + esc(k.colore_sfondo) + ';color:' + esc(k.colore_testo) + '"' : '')
    + (titolo ? ' title="' + esc(titolo) + '"' : '') + '>' + esc(reali.map(function (i) { return i.c + (i.l ? ' ' + i.l : ''); }).join(' + '))
    + (note.length ? '<span class="nota">●</span>' : '') + '</td>';
}

function aggiornaTotali() {
  RU.giorni.forEach(function (g) {
    var n = 0;
    RU.mil.forEach(function (m) {
      if (!inForzaIl(m, g.data)) return;
      var lista = (RU.celle[m.id + '|' + g.data] || []).filter(function (i) { return i.c !== 'NOTA'; });
      if (g.festivo && !lista.length) return; // festivi: in sede solo chi ha un servizio o un'attivita'
      if (lista.every(function (i) { return si(codice(i.c).presente_in_sede); })) n++;
    });
    var td = document.querySelector('td[data-tot="' + g.data + '"]');
    if (td) td.textContent = n;
  });
}

/** dopo un servizio con smonto (guardie) aggiorna anche la casella del giorno successivo */
function aggiornaSmonto(mId, data, cod) {
  if (!si(codice(cod).rc_dopo)) return;
  var dopo = piuGiorni(data, 1);
  if (!RU.giorni.some(function (g) { return g.data === dopo; })) return;
  api('cella', { militare_id: mId, data: dopo }, true).then(function (l) { sostituisciCella(mId, dopo, l); });
}

function sostituisciCella(mId, data, lista) {
  RU.celle[mId + '|' + data] = lista;
  var td = document.querySelector('td.cella[data-m="' + mId + '"][data-d="' + data + '"]');
  var m = RU.militari.filter(function (x) { return x.id === mId; })[0];
  var g = RU.giorni.filter(function (x) { return x.data === data; })[0];
  if (td && m && g) td.outerHTML = htmlCella(m, g);
  aggiornaTotali();
}

var dipingendo = false;
function cambiaPennello() {
  var v = document.getElementById('pn-tipo').value, s = document.getElementById('pn-tipo');
  var k = CFG.codiciMap[v];
  s.style.background = k ? k.colore_sfondo : ''; s.style.color = k ? k.colore_testo : '';
  document.getElementById('griglia').classList.toggle('pennello-attivo', !!v);
}

function applicaPennello(td) {
  var tipo = document.getElementById('pn-tipo').value;
  if (!tipo || td.dataset.inCorso) return;
  td.dataset.inCorso = '1';
  var base = { militare_id: td.dataset.m, data: td.dataset.d };
  // aggiornamento immediato (ottimistico): se il server rifiuta, la casella torna com'era
  var chiave = base.militare_id + '|' + base.data, prima = (RU.celle[chiave] || []).slice();
  var provvisoria = tipo === '__cancella' ? [] : (document.getElementById('pn-sost').checked ? [] : prima.filter(function (x) { return x.c !== tipo; }))
    .concat(tipo === '__cancella' ? [] : [{ id: '', m: base.militare_id, d: base.data, c: tipo, l: document.getElementById('pn-loc').value.toUpperCase(), n: '' }]);
  sostituisciCella(base.militare_id, base.data, provvisoria);
  var tdProv = document.querySelector('td.cella[data-m="' + base.militare_id + '"][data-d="' + base.data + '"]');
  if (tdProv) { tdProv.dataset.inCorso = '1'; tdProv.classList.add('in-salvataggio'); }
  var p = tipo === '__cancella' ? api('cellaElimina', base, true).then(function (l) {
      var dopo = piuGiorni(base.data, 1);
      if (RU.giorni.some(function (g) { return g.data === dopo; })) api('cella', { militare_id: base.militare_id, data: dopo }, true).then(function (l2) { sostituisciCella(base.militare_id, dopo, l2); });
      return l;
    })
    : api('cellaSalva', Object.assign(base, { codice: tipo, localita: document.getElementById('pn-loc').value, sostituisci: document.getElementById('pn-sost').checked }), true);
  p.then(function (lista) {
    if (tipo !== '__cancella' && si(codice(tipo).perde_forza)) { document.getElementById('pn-tipo').value = ''; avviso('Non piu\' in forza da quel giorno'); ricarica(); return; }
    sostituisciCella(base.militare_id, base.data, lista);
    if (tipo !== '__cancella') aggiornaSmonto(base.militare_id, base.data, tipo);
  }, function () { sostituisciCella(base.militare_id, base.data, prima); });
}

function collegaGriglia() {
  var gr = document.getElementById('griglia');
  if (!gr) return;
  var pn = document.getElementById('pn-tipo');
  gr.addEventListener('mousedown', function (ev) {
    var td = ev.target.closest('td.cella');
    if (!td || !pn || !pn.value) return;
    ev.preventDefault(); dipingendo = true; applicaPennello(td);
  });
  gr.addEventListener('mouseover', function (ev) {
    if (!dipingendo) return;
    var td = ev.target.closest('td.cella');
    if (td) applicaPennello(td);
  });
  document.addEventListener('mouseup', function () { dipingendo = false; });
  gr.addEventListener('click', function (ev) {
    var td = ev.target.closest('td.cella');
    if (!td || (pn && pn.value)) return;
    dialogoCella(td.dataset.m, td.dataset.d);
  });
}

/** Carica un elemento gia' inserito nel modulo per modificarlo. */
function modificaVoce(id) {
  var v = (RU.celle[RU.dlg.m + '|' + RU.dlg.d] || []).filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  RU.dlg.id = id;
  var f = document.getElementById('modulo');
  f.codice.value = v.c; f.localita.value = v.l || ''; f.quantita.value = v.q || ''; f.note.value = v.n || '';
  f.al.value = ''; f.al.disabled = true; f.escludiFestivi.disabled = true; f.sostituisci.checked = false;
  document.getElementById('titolo-form').innerHTML = 'Modifica ' + etichetta(v.c, v.l)
    + ' <button type="button" class="link piccolo" onclick="annullaModifica()">annulla modifica</button>';
  document.getElementById('salva').textContent = 'Salva modifica';
  f.codice.focus();
}
function annullaModifica() {

function dialogoPeriodo(mId) {
  var caricaMil = RU ? Promise.resolve(RU.militari) : api('militari');
  caricaMil.then(function (militari) {
    apriDialogo(modulo('Periodo: inserisci o cancella', [

      { n: 'dal', l: 'Dal', t: 'date', req: true, v: oggi() },

/** Salva sul dispositivo un file arrivato dal server in base64. */
function scaricaFile(nome, mime, base64) {
  var bin = atob(base64), byte = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) byte[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([byte], { type: mime || 'application/octet-stream' }));
  var a = document.createElement('a');
  a.href = url; a.download = nome; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

function esporta(anno, mese) {
  api('esporta', { anno: anno, mese: mese }).then(function (r) {
    scaricaFile(r.nome, r.mime, r.base64);
    avviso('Scaricato ' + r.nome + ' (una copia e\' anche nella cartella Esportazioni)');
  });
}

function scaricaDocumento(idScadenza) {
  api('documento', { id: idScadenza }).then(function (r) { scaricaFile(r.nome, r.mime, r.base64); });
}

function vistaServizi(anno, mese, categoria) {
  var o = oggi().split('-');
  anno = Number(anno) || Number(o[0]);
  mese = mese === undefined ? Number(o[1]) : Number(mese); // 0 = tutto l'anno
  categoria = categoria || 'SER';
  var dal = anno + '-' + pad(mese || 1) + '-01';
  var al = mese ? piuGiorni(mese === 12 ? (anno + 1) + '-01-01' : anno + '-' + pad(mese + 1) + '-01', -1) : anno + '-12-31';
  api('servizi', { dal: dal, al: al, categoria: categoria }).then(function (r) {
    var vai = function (a, m, c) { return '#servizi/' + a + '/' + m + '/' + c; };
    var totali = {}, perCodice = {};
    r.militari.forEach(function (m) {
      totali[m.id] = 0;
      r.codici.forEach(function (c) { var n = r.conta[m.id + '|' + c] || 0; totali[m.id] += n; perCodice[c] = (perCodice[c] || 0) + n; });
    });
    var eff = r.militari.filter(function (m) { return m.stato === 'EFF'; }).map(function (m) { return totali[m.id]; });
    var min = eff.length ? Math.min.apply(null, eff) : 0, max = eff.length ? Math.max.apply(null, eff) : 0;
    var tot = Object.keys(totali).reduce(function (a, k) { return a + totali[k]; }, 0);
    var media = eff.length ? eff.reduce(function (a, b) { return a + b; }, 0) / eff.length : 0;
    var h = '<div class="intestazione"><h1>Servizi ' + (mese ? MESI[mese] + ' ' : 'anno ') + anno + '</h1><div class="naviga">'
      + '<select onchange="location.hash=this.value">' + opzioni([[vai(anno, 0, categoria), 'Tutto l\'anno']].concat(MESI.slice(1).map(function (n, k) { return [vai(anno, k + 1, categoria), n]; })), vai(anno, mese, categoria)) + '</select>'
      + '<a class="bottone" href="' + vai(anno - 1, mese, categoria) + '">&larr; ' + (anno - 1) + '</a><a class="bottone" href="' + vai(anno + 1, mese, categoria) + '">' + (anno + 1) + ' &rarr;</a>'
      + '<select onchange="location.hash=this.value">' + opzioni([[vai(anno, mese, 'SER'), 'Servizi in sede (guardie, Udp, Gdg...)'], [vai(anno, mese, 'FUO'), 'Impieghi fuori sede'], [vai(anno, mese, 'ATT'), 'Attivita\' / visite'], [vai(anno, mese, 'ASS'), 'Assenze'], [vai(anno, mese, 'tutte'), 'Tutti i codici']], vai(anno, mese, categoria)) + '</select>'
      + '<button class="bottone" onclick="window.print()">Stampa</button></div></div>'
      + '<p class="aiuto">Numero di giorni per codice. Tra gli effettivi: media <strong>' + num(media) + '</strong>; in verde chi ne ha fatti di meno (' + min + '), in rosso chi ne ha fatti di piu\' (' + max + '). Utile per distribuire i turni in modo equo.</p>'
      + (r.codici.length ? '<div class="contenitore-griglia" style="max-height:none"><table class="tabella licenze servizi"><tr><th>Militare</th>'
        + r.codici.map(function (c) { return '<th>' + etichetta(c) + '</th>'; }).join('') + '<th>Totale</th></tr>'
        + r.militari.map(function (m) {

  apriDialogo(modulo(nuovo ? 'Nuovo utente' : 'Modifica utente', [
    { n: 'email', l: 'Nome utente', req: true, v: u.email, aiuto: 'Es. mario.rossi (3-60 caratteri: lettere, numeri, punto, trattino, @). Serve per entrare.' },
    { n: 'nome', l: 'Nome da mostrare', v: u.nome },
    { n: 'ruolo', l: 'Ruolo', t: 'select', o: [['Amministratore', 'Amministratore - tutto'], ['Operatore', 'Operatore - brogliaccio, elenco personale, licenze, scadenze'], ['Consultazione', 'Consultazione - sola lettura']], v: u.ruolo },
    { n: 'password', l: nuovo ? 'Password provvisoria' : 'Nuova password provvisoria (facoltativa)', t: 'password', req: nuovo, aiuto: 'Almeno 8 caratteri, con lettere e numeri. Comunicala all\'interessato: al primo accesso dovra\' sceglierne una sua.' }
  ]));
  if (!nuovo) document.querySelector('#modulo [name=email]').readOnly = true;
  document.querySelector('#modulo [name=email]').setAttribute('autocapitalize', 'none');
  document.querySelector('#modulo [name=password]').setAttribute('autocomplete', 'new-password');
  alSalva(function (d) {
    d.email = d.email.trim().toLowerCase();
    return api('utenteSalva', d).then(function () { chiudiDialogo(); avviso('Utente salvato'); ricarica(); });
  });
}
function azzeraPassword(nomi) {
  if (!nomi.length) return;
  apriDialogo(modulo('Password provvisoria per ' + nomi.join(', '), [
    { n: 'password', l: 'Password provvisoria', t: 'password', req: true, aiuto: 'Almeno 8 caratteri, con lettere e numeri. Al primo accesso dovranno sceglierne una personale.' }
  ]));
  document.querySelector('#modulo [name=password]').setAttribute('autocomplete', 'new-password');
  alSalva(function (d) { return api('azzeraPassword', { emails: nomi, password: d.password }).then(function () { chiudiDialogo(); avviso('Password provvisoria assegnata'); ricarica(); }); });
}
function eliminaUtenti(emails) {
  if (emails.length && confirm('Rimuovere ' + emails.join(', ') + '? Non potranno piu\' entrare.')) api('utenteElimina', { emails: emails }).then(function () { ricarica(); });
}
function vistaRegistro() {
  api('registro').then(function (r) {
    main('<h1>Registro modifiche</h1><p class="aiuto">Ultime 500 operazioni.</p><table class="tabella"><tr><th>Quando</th><th>Utente</th><th>Operazione</th></tr>'
      + r.map(function (x) { return '<tr><td>' + esc(x.quando) + '</td><td>' + esc(x.utente) + '</td><td>' + esc(x.azione) + '</td></tr>'; }).join('') + '</table>');
  });
}

avvio();
</script>
